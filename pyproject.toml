[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pleiades_sidebar"
version = "0.0.1"
authors = [
  { name="Tom Elliott", email="tom.elliott@nyu.edu" },
]
description = "Create data for an external projects sidebar for Pleiades place pages"
readme = "README.md"
requires-python = ">=3.15.1"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]
dependencies = [
    "airtight>=0.2.0",
    "encoded-csv>=0.2",
    "jsonlines>=4.0.0",
    "lxml>=6.1.3",
    "platformdirs>=4.13.7",
    "python-slugify>=9.1.3",
    "requests>=2.34.2",
    "textnorm>=1.2",
    "validators>=0.36.0",
]
[project.urls]
# "Homepage" = "https://github.com/pypa/sampleproject"
# "Bug Tracker" = "https://github.com/pypa/sampleproject/issues"
[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"

[tool.uv]
python-preference = "only-managed"
system-certs = true

[tool.uv.sources]
encoded-csv = { git = "https://github.com/paregorios/encoded_csv.git" }
